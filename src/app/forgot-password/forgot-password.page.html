<ion-content>
  <div class="forgot-container">
    <div class="forgot-card">
      <h2>Recuperar contraseña</h2>
      <p>Ingresa tu correo para recibir un enlace de restablecimiento.</p>

      <ion-item lines="none">
        <ion-input type="email" placeholder="Correo electrónico"></ion-input>
      </ion-item>

      <ion-button expand="block">ENVIAR ENLACE</ion-button>

      <a (click)="volverLogin()" class="back-link">Volver al inicio de sesión</a>
    </div>
  </div>
</ion-content>
