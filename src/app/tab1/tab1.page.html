<ion-header>
  <ion-toolbar color="dark" class="toolbar">
    <ion-title>Mis Libros</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding fondo">

  <ion-searchbar
    placeholder="Buscar por título, autor o categoría"
    (ionInput)="filterBooks($event)">
  </ion-searchbar>

  <ion-item lines="none" class="filtro-item">
    <ion-label>Categoría</ion-label>
    <ion-select
      interface="popover"
      placeholder="Todas"
      [(ngModel)]="selectedCategory"
      (ionChange)="applyFilters()">
      <ion-select-option value="">Todas</ion-select-option>
      <ion-select-option *ngFor="let cat of categories" [value]="cat">{{ cat }}</ion-select-option>
    </ion-select>
  </ion-item>

  <ion-list *ngIf="filteredBooks.length > 0; else noBooks">
    <ion-item-sliding *ngFor="let book of filteredBooks">

      <ion-item lines="none" class="book-item" (click)="verDetalles(book)">
        <ion-avatar slot="start">
          <img *ngIf="book.photo; else noImage" [src]="book.photo" alt="Portada del libro">
          <ng-template #noImage>
            <img src="assets/default-book.jpg" alt="Sin portada">
          </ng-template>
        </ion-avatar>

        <ion-label>
          <h2>{{ book.title }}</h2>
          <p><strong>Autor:</strong> {{ book.author }}</p>
          <p><strong>Categoría:</strong> {{ book.category }}</p>
          <p><strong>Estado:</strong> {{ book.status || 'No especificado' }}</p>

          <ion-button fill="clear" (click)="verDetalles(book)">
            Ver más detalles del libro
          </ion-button>

        </ion-label>
      </ion-item>

      <ion-item-options side="end">
        <ion-item-option color="medium" (click)="editBook(book)">
          Editar
        </ion-item-option>
        <ion-item-option color="danger" (click)="deleteBook(book)">
          Eliminar
        </ion-item-option>
      </ion-item-options>

    </ion-item-sliding>
  </ion-list>

  <ng-template #noBooks>
    <ion-text color="medium">
      <p class="ion-text-center">No tienes libros aún. ¡Publica uno desde Intercambios!</p>
    </ion-text>
  </ng-template>

  <ion-text *ngIf="filteredBooks.length === 0 && books.length > 0" color="medium">
    <p class="ion-text-center">No hay resultados para tu búsqueda.</p>
  </ion-text>
</ion-content>
